[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cde"
version = "0.1.0"
description = "Cinephile discovery engine - metadata-only, graph-based film backbone"
requires-python = ">=3.10"
# Includes the app/UI deps (fastapi, uvicorn, streamlit), not just the
# core engine's (duckdb, requests) -- deliberately, as a belt-and-suspenders
# safeguard: Streamlit Community Cloud auto-discovers requirements.txt OR
# pyproject.toml at the repo root, and this repo's precedence between the
# two isn't something to gamble the deploy on. Kept in sync with
# requirements.txt (= requirements-core.txt + requirements-app.txt); the
# core/app split for local dev proof-of-no-web-dependency lives in those
# files, not here.
dependencies = [
    "duckdb",
    "requests",
    "fastapi",
    "uvicorn",
    "streamlit",
]

[tool.setuptools.packages.find]
include = ["cde*"]

[tool.pytest.ini_options]
markers = [
    "integration: runs against the real data/processed/film.duckdb (skipped if absent)",
]
addopts = "-q"
testpaths = ["tests"]
# Root-level harness scripts (eval_explore.py, build_demo_artifact.py) are
# importable locally only because a dev venv's cwd-adjacent editable
# install / interactive-shell sys.path happens to include the repo root.
# CI's clean checkout does not -- tests/test_eval_explore.py's bare
# `from eval_explore import ...` failed collection there with
# ModuleNotFoundError, the same local-vs-CI sys.path class of bug as the
# `cde` import fix. This puts the repo root on pytest's own sys.path
# (independent of whatever import mechanism cde itself uses) so those
# harness scripts resolve identically in both places.
pythonpath = ["."]

[tool.flake8]
max-line-length = 100
extend-ignore = ["E203", "W503"]
exclude = [".git", "__pycache__", ".venv", "venv", "data"]
