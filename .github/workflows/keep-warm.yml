name: keep-warm

# Streamlit Community Cloud sleeps idle apps after ~12h; a sleeping demo
# greeting a recruiter is a bad first impression, so this pings the live
# public demo (https://cinegraph.streamlit.app) periodically to keep it
# warm between visits.
#
# Honest caveat: this is best-effort portfolio warmth, not guaranteed
# uptime. Community Cloud's sleep behavior can change, and pinging a
# free-tier app on a schedule is best-effort, not a guarantee it will
# always be awake for a given visitor.

on:
  schedule: [{ cron: "*/12 * * * *" }]
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -sS -o /dev/null -w "%{http_code}\n" "https://cinegraph.streamlit.app"
